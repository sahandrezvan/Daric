name: Apply Daric 1.4 patch

on:
  push:
    branches:
      - feat/financial-planning-v1.4.0

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --exclude=.github/workflows/release-android.yml daric-v1.4.0.patch
          git add -A
          git commit -m "feat: add financial planning and reminders"
          git push origin HEAD:feat/financial-planning-v1.4.0
