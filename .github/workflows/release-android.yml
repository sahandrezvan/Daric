name: Release Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v1.2.0
      RELEASE_NAME: Daric 1.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        if: steps.existing.outputs.exists != 'true'
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        if: steps.existing.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_STORE_PASSWORD" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)

      - name: Restore upload keystore
        if: steps.existing.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/daric-upload.jks"

      - name: Build signed APK and AAB
        if: steps.existing.outputs.exists != 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/daric-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew clean assembleRelease bundleRelease --stacktrace

      - name: Collect artifacts
        if: steps.existing.outputs.exists != 'true'
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/release/app-release.apk releases/Daric-1.2.0.apk
          cp app/build/outputs/bundle/release/app-release.aab releases/Daric-1.2.0.aab
          sha256sum releases/* > releases/SHA256SUMS.txt

      - name: Upload signed artifacts
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daric-1.2.0-release
          path: releases/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" releases/*             --target "$GITHUB_SHA"             --title "$RELEASE_NAME"             --generate-notes
